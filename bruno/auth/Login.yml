info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "test@example.com",
        "password": "string123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let resData = res.getBody();

        if (resData && resData.token) {
          bru.setEnvVar("jwtToken", resData.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
