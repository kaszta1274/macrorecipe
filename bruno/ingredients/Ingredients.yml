info:
  name: Ingredients
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/ingredients?query=chicken&page=1&limit=5"
  params:
    - name: query
      value: chicken
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "5"
      type: query
  auth:
    type: bearer
    token: "{{jwtToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
