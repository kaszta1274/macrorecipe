info:
  name: Update User Password
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/users/password"
  body:
    type: json
    data: |-
      {
        "password": "string123",
        "new_password": "string1234"
      }
  auth:
    type: bearer
    token: "{{jwtToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
